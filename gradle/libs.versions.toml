# androidx 는 compileSdk 34 호환 버전 (Pleos Connect 에뮬레이터 = API 34)
[versions]
agp = "8.8.2"
kotlin = "2.0.0"
coroutines = "1.8.1"
coreKtx = "1.13.1"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.04.01"
# 2026-10-29 공개 Maven maven-metadata.xml <latest> 확인
vehicleSdk = "2.3.2"
sttSdk = "3.3.1"
ttsSdk = "3.3.1"
llmSdk = "2.1.3.2"
naviSdk = "3.0.5"
junit = "4.13.2"
# QR 그리기만(카메라·스캔 없음). 순수 자바, 안드로이드 의존 없음
zxing = "3.5.3"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

pleos-vehicle = { module = "ai.pleos.playground:Vehicle", version.ref = "vehicleSdk" }
pleos-stt = { module = "ai.pleos.playground:SpeechToText", version.ref = "sttSdk" }
pleos-tts = { module = "ai.pleos.playground:TextToSpeech", version.ref = "ttsSdk" }
pleos-llm = { module = "ai.pleos.playground:LLM", version.ref = "llmSdk" }
pleos-navi = { module = "ai.pleos.playground:NaviHelper", version.ref = "naviSdk" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# build-logic 전용
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# build-logic 컨벤션 플러그인
chagok-jvm-library = { id = "chagok.jvm.library" }
chagok-android-library = { id = "chagok.android.library" }
chagok-android-compose = { id = "chagok.android.compose" }
